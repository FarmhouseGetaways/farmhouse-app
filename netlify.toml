# The app — Netlify config.
# Static + two functions. No build step at publish time; run tools/build.py
# locally, then drop the folder.

[build]
  publish = "."
  # Netlify's build image ships Python 3, so the generator runs on every deploy
  # and the committed HTML can never drift from tools/build.py.
  command = "python3 tools/build.py"

# Not indexed. This is an app you install, not a page that should compete with
# the three websites in search — and it duplicates their content by design.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must never be cached, or a deploy cannot reach a phone
# that already has the app. This is the single most common way a PWA gets
# stuck on an old version.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

# Clean routes. These are what the service worker precaches, so they have to
# resolve exactly as written.
[[redirects]]
  from = "/map"
  to = "/map.html"
  status = 200
[[redirects]]
  from = "/stay"
  to = "/stay.html"
  status = 200
[[redirects]]
  from = "/watch"
  to = "/watch.html"
  status = 200
[[redirects]]
  from = "/more"
  to = "/more.html"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Watches @minibarnmarket for a new post every fifteen minutes and pushes it to
# everyone who installed the app. Fifteen is a compromise: often enough that
# "first to know" is true, rare enough that the Instagram API never notices.
[functions."push-watch"]
  schedule = "*/15 * * * *"

# Rolls the 60-day Instagram token every Monday.
[functions."instagram-refresh"]
  schedule = "0 9 * * 1"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
